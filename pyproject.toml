[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bluequbit-otoc-workflow"
version = "0.1.0"
description = "Local workflow helpers for the BlueQubit OTOC challenge"
requires-python = ">=3.10"
dependencies = ["bluequbit", "python-dotenv"]

[tool.setuptools.packages.find]
where = ["src"]
