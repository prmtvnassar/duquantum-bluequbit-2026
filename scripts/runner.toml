# Runner settings. Everything the challenge kit might change lives here, so most
# kickoff adjustments are edits to this file, not to code.
#
# How a circuit entry turns into jobs is decided by its `provider`; the providers
# themselves live in src/runner/targets.py (the one code file to adapt to the kit).

[backend]
# Device names passed to bq.run(device=...). The SDK lists "mps.cpu", "mps.gpu",
# "pauli-path"; confirm the names the challenge accepts at kickoff.
mps_device = "mps.cpu"
pps_device = "pauli-path"
exact_device = "cpu"        # exact statevector; only fits small circuits (S1, S2)

# SDK option keys. Rename here if the challenge wrapper uses different ones.
[backend.option_names]
mps_setting = "mps_bond_dimension"
pps_setting = "pauli_path_truncation_threshold"
pps_transpile = "pauli_path_circuit_transpilation_level"

# Extra options passed unchanged to every job of that method, e.g. mps = { force_run = true }.
[backend.extra_options]
mps = {}
pps = {}

[limits]
max_in_flight = 5           # hackathon limit: 5 jobs running at once per account
max_jobs_per_command = 40   # bigger batches need --max-jobs
poll_interval_s = 5
job_timeout_s = 7200        # stop waiting (jobs keep running; use --resume)

[observable]
# Pauli measured for each target qubit. OTOC(2) echoes measure Z on the probe qubit.
pauli = "Z"
# "little": qubit 0 is the rightmost character (Qiskit and, per our smoke test, BlueQubit).
order = "little"

# ---------------------------------------------------------------------------
# Circuits. The table name (e.g. sample_1) is what you type on the command line.
#   workbook     run sheet that receives results
#   official_id  the circuit ID used in the submission template (written to Status!B4 by --setup)
#   provider     how to build each qubit's job: demo | qasm | stored | kit (see targets.py)
#   qubits       "all" (0..n-1), "workbook" (Qubits!A6:A165), or a list like [0, 3, 5]
# ---------------------------------------------------------------------------

# Official circuits (from the challenge page). Each qubit q of circuit C is its own
# stored circuit "Duke_<C>_<q>"; the value is <Z> on qubit q. n comes from
# get_circuit_info (free). Submission IDs are Duke_<C>_<q>.
[circuits.S1]
workbook = "runs/sample_1.xlsx"
official_id = "S1"
provider = "stored"
circuit_id = "Duke_S1_{qubit}"
n_qubits = 0
qubits = "all"

[circuits.S2]
workbook = "runs/sample_2.xlsx"
official_id = "S2"
provider = "stored"
circuit_id = "Duke_S2_{qubit}"
n_qubits = 0
qubits = "all"

